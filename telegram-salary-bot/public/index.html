<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính lương</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap");
*, *::before, *::after { box-sizing: border-box }
:root {
  --bg: var(--tg-theme-bg-color, #0f1115);
  --card: var(--tg-theme-secondary-bg-color, #171a21);
  --text: var(--tg-theme-text-color, #e9edf5);
  --hint: var(--tg-theme-hint-color, #8b93a7);
  --accent: var(--tg-theme-button-color, #3b82f6);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --ok: #22c55e;
  --bad: #f43f5e;
  --warn: #f59e0b;
  --line: rgba(255,255,255,.08);
  --soft: rgba(127,127,127,.12);
  --r: 18px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: var(--tg-theme-bg-color, #f4f5f7);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0f1115);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --line: rgba(15,17,21,.08);
  }
}
html, body { margin: 0; padding: 0 }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px 18px 108px }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.col { min-width: 0; }
.col .card:first-child, .col .tabs:first-child { margin-top: 0; }
@media (max-width: 760px) {
  .wrap { max-width: 540px; padding: 14px 14px 108px; }
  .grid { display: block; }
  .col + .col { margin-top: 12px; }
  .bar { width: 100%; }
}

/* ---------- HERO ---------- */
.hero {
  border-radius: 22px;
  padding: 18px 18px 16px;
  color: #fff;
  background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 55%, #22d3ee 100%);
  box-shadow: 0 12px 30px rgba(14,165,233,.28);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  width: 180px; height: 180px;
  right: -60px; top: -70px;
  background: rgba(255,255,255,.16);
  border-radius: 50%;
}
.hero .top { display: flex; align-items: center; gap: 10px; position: relative }
.hero .msel { margin-left: auto; display: flex; align-items: center; gap: 4px }
.hero .msel select {
  background: rgba(255,255,255,.18);
  border: none; color: #fff;
  padding: 7px 8px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  appearance: none; -webkit-appearance: none;
}
.hero .msel select option { color: #111827 }
.hero .msel button {
  width: 30px; height: 32px; flex: none;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,.18); color: #fff;
  font-size: 17px; line-height: 1; cursor: pointer;
}
.hero .cap { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; margin-top: 14px }
.hero .big { font-size: 34px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums }
.meter { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.22); margin-top: 12px }
.meter i { height: 100%; display: block; transition: width .35s ease }
.meter .p { background: #a7f3d0 }
.meter .m { background: #fda4af }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; position: relative }
.tag { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: rgba(255,255,255,.18) }
.hero-detail {
  position: relative;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(10px);
}
.hero-detail > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: rgba(255,255,255,.92);
}
.hero-detail > summary::-webkit-details-marker { display: none }
.hero-detail #rows { margin-top: 8px }
.hero-detail .row { border-bottom-color: rgba(255,255,255,.18); color: rgba(255,255,255,.95) }
.hero-detail .row span { color: rgba(255,255,255,.72) }
.hero-detail .row.plus b { color: #bbf7d0 }
.hero-detail .row.minus b { color: #fecdd3 }
.hero-detail .row.sum b, .hero-detail .row.sum span { color: #fff }
.hero-detail .warn { background: rgba(255,255,255,.16); color: #fff7ed }


/* ---------- CARD ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  margin-top: 12px;
}
.card h3 {
  margin: 0;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--hint); display: flex; align-items: center; gap: 8px;
}
.field { margin-top: 12px }
.field label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--hint); margin-bottom: 6px }
.field label .unit { font-size: 11px; opacity: .8 }
input[type=text], input[type=number] {
  width: 100%; padding: 13px 14px;
  font-size: 17px; font-weight: 600;
  color: var(--text); background: var(--soft);
  border: 1.5px solid transparent; border-radius: 14px;
  outline: none; font-variant-numeric: tabular-nums;
  transition: border-color .15s, background .15s;
}
input:focus { border-color: var(--accent); background: rgba(59,130,246,.10) }
input.bad { border-color: var(--bad); background: rgba(244,63,94,.10) }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }
.chip {
  font: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 11px; border-radius: 99px;
  background: var(--soft); color: var(--hint);
  border: none; cursor: pointer;
}
.chip:active { transform: scale(.95) }
.extra-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); color:var(--hint); font-size:13px; font-weight:700 }
.mini-btn { border:none; border-radius:12px; padding:9px 12px; background:rgba(59,130,246,.12); color:var(--accent); font:inherit; font-size:13px; font-weight:800; cursor:pointer }
.extra-item { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-top:10px; align-items:center }
.extra-item input { font-size:14px; padding:11px 12px; border-radius:12px }
.extra-del { width:42px; height:42px; border:none; border-radius:12px; background:rgba(244,63,94,.10); color:var(--bad); font-size:18px; font-weight:900; cursor:pointer }
@media (max-width:520px){ .extra-item { grid-template-columns:1fr; } .extra-del { width:100%; } }

/* ---------- STEPPER ---------- */
.stepper { display: flex; align-items: center; gap: 10px; margin-top: 12px }
.stepper button {
  width: 46px; height: 46px; flex: none;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--soft); color: var(--text);
  font-size: 22px; font-weight: 600; cursor: pointer;
}
.stepper input { text-align: center }
input[type=range] { width: 100%; margin-top: 12px; accent-color: var(--accent) }

/* ---------- TABS ---------- */
.tabs { display: flex; gap: 6px; background: var(--soft); padding: 4px; border-radius: 15px; margin-top: 14px }
.tabs button {
  flex: 1; border: none; background: transparent; color: var(--hint);
  padding: 10px 6px; border-radius: 12px;
  font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
}
.tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 3px 10px rgba(0,0,0,.18) }
.tabs .n { font-size: 11px; opacity: .7; margin-left: 4px }
.panel { display: none }
.panel.on { display: block }

/* ---------- BREAKDOWN ---------- */
details.card > summary {
  list-style: none; cursor: pointer;
  font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--hint);
  display: flex; justify-content: space-between;
}
details.card > summary::-webkit-details-marker { display: none }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; border-bottom: 1px dashed var(--line) }
.row span { color: var(--hint) }
.row b { font-variant-numeric: tabular-nums; white-space: nowrap }
.row.plus b { color: var(--ok) }
.row.minus b { color: var(--bad) }
.row.sum { border: none; padding-top: 12px; font-size: 16px; font-weight: 800 }
.warn { background: rgba(245,158,11,.14); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 10px }

/* ---------- STICKY BAR ---------- */
.bar {
  position: fixed; left: 50%; right: auto; bottom: 0; transform: translateX(-50%);
  width: min(100%, 1120px);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px calc(11px + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.16);
}
.bar .v { flex: 1; min-width: 0 }
.bar .v small { display: block; font-size: 11px; color: var(--hint) }
.bar .v strong { font-size: 19px; font-variant-numeric: tabular-nums }
.bar-actions { display: flex; gap: 8px; align-items: center }
.btn {
  border: none; border-radius: 14px; padding: 13px 20px;
  background: var(--accent); color: var(--accent-text);
  font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
}
.btn.secondary { background: var(--soft); color: var(--text); border: 1px solid var(--line) }
.btn:disabled { opacity: .45 }
@media (max-width: 520px) { .bar-actions { gap: 6px } .btn { padding: 12px 13px; font-size: 13px } }
.toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 99px;
  font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 9;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0) }
.flash { animation: fl .35s ease }
@keyframes fl {
  from { opacity: .4; transform: translateY(-3px) }
  to { opacity: 1; transform: none }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HERO -->
  <div class="hero">
    <div class="top">
      <div style="font-weight:700">💰 Bảng lương</div>
      <div class="msel">
        <button type="button" id="mPrev">‹</button>
        <select id="mThang"></select>
        <select id="mNam"></select>
        <button type="button" id="mNext">›</button>
      </div>
    </div>
    <div class="cap">Thực nhận dự kiến</div>
    <div class="big" id="tong">0 ₫</div>
    <div class="meter"><i class="p" id="mP" style="width:0"></i><i class="m" id="mM" style="width:0"></i></div>
    <div class="tags">
      <div class="tag" id="tgNgay">—</div>
      <div class="tag" id="tgNgayLuong">—</div>
    </div>
    <details class="hero-detail">
      <summary><span>🧾 Xem chi tiết bảng lương</span><span>▾</span></summary>
      <div id="rows"></div>
      <div id="canhBao"></div>
    </details>
  </div>

  <div class="grid">
    <div class="col">
      <!-- CỐ ĐỊNH -->
      <details class="card" open>
        <summary><span>⚙️ THÔNG TIN CỐ ĐỊNH</span><span id="sumFix">—</span></summary>
        <div class="field">
          <label>Lương cơ bản / tháng <span class="unit">9tr · 9.000.000</span></label>
          <input type="text" inputmode="numeric" data-k="lcb" data-money data-chips="7tr,8tr,9tr,10tr,12tr" placeholder="9.000.000">
        </div>
        <div class="field">
          <label>Hệ số trách nhiệm <span class="unit">mặc định 0</span></label>
          <input type="text" inputmode="decimal" data-k="hs" data-chips="0,0.02,0.03,0.05" placeholder="0">
        </div>
        <div class="field">
          <label>Mức cơ sở tính trách nhiệm <span class="unit">trống = lương cơ bản</span></label>
          <input type="text" inputmode="decimal" data-k="mcs" data-money placeholder="= lương cơ bản">
        </div>
        <div class="field">
          <label>Tiền ăn 1 buổi <span class="unit">× ngày công</span></label>
          <input type="text" inputmode="decimal" data-k="ta" data-money data-chips="20k,25k,30k,50k" placeholder="30k">
        </div>
      </details>

      <!-- NGÀY CÔNG -->
      <div class="card">
        <h3>📆 Ngày công thực tế</h3>
        <div class="stepper">
          <button type="button" id="ncDown">−</button>
          <input type="text" inputmode="decimal" data-k="nc" id="ncNum" value="24">
          <button type="button" id="ncUp">+</button>
        </div>
        <input type="range" id="ncRange" min="0" max="31" step="0.5" value="24">
      </div>
    </div>

    <div class="col">
      <!-- TABS -->
      <div class="tabs">
        <button type="button" class="on" data-tab="cong">➕ Khoản cộng<span class="n" id="nCong"></span></button>
        <button type="button" data-tab="tru">➖ Khoản trừ<span class="n" id="nTru"></span></button>
      </div>

      <div class="panel on" id="p-cong">
        <div class="card">
          <div class="field"><label>Trợ cấp</label>
            <input type="text" inputmode="decimal" data-k="tc" data-money data-chips="200k,500k,1tr,2tr,3tr,5tr" placeholder="0"></div>
          <div class="field"><label>Công tác phí</label>
            <input type="text" inputmode="decimal" data-k="ctp" data-money data-chips="500k,1tr2" placeholder="0"></div>
          <div class="field"><label>Thưởng nóng</label>
            <input type="text" inputmode="decimal" data-k="th" data-money data-chips="300k,500k" placeholder="0"></div>
          <div class="field"><label>Tăng ca</label>
            <input type="text" inputmode="decimal" data-k="ot" data-money data-chips="200k,450k" placeholder="0"></div>
          <div class="field"><label>Upsell</label>
            <input type="text" inputmode="decimal" data-k="ups" data-money data-chips="500k,1tr2" placeholder="0"></div>
          <div class="extra-head">
            <span>Khoản cộng bổ sung</span>
            <button type="button" class="mini-btn" id="btnThemCong">+ Thêm khoản</button>
          </div>
          <div id="extraCong"></div>
        </div>
      </div>

      <div class="panel" id="p-tru">
        <div class="card">
          <div class="field"><label>Đi muộn</label>
            <input type="text" inputmode="decimal" data-k="dm" data-money data-chips="50k,100k" placeholder="0"></div>
          <div class="field"><label>Phạt</label>
            <input type="text" inputmode="decimal" data-k="ph" data-money data-chips="50k,200k" placeholder="0"></div>
          <div class="field"><label>Ứng lương</label>
            <input type="text" inputmode="decimal" data-k="ung" data-money data-chips="1tr,2tr,3tr" placeholder="0"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="bar">
  <div class="v"><small>Thực nhận</small><strong id="barTong">0 ₫</strong></div>
  <div class="bar-actions">
    <button class="btn secondary" id="btnAnh">Xuất ảnh</button>
    <button class="btn" id="btnGuiBot">Gửi về bot</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CẤU HÌNH — CHỈ SỬA 2 DÒNG NÀY ============ */
var API_URL = "https://script.google.com/macros/s/AKfy_DAN_URL_CUA_BAN/exec";
var WEB_SECRET = "WEB_SECRET_CUA_BAN";
/* ========================================================= */

var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var $ = function (s) { return document.querySelector(s) };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)) };

/* ---------- helpers ---------- */
function parseMoney(raw) {
  if (raw == null) return null;
  var s = String(raw).toLowerCase().trim().replace(/₫|vnd|đ/g, "").replace(/\s+/g, "");
  if (!s) return 0;
  s = s.replace(/triệu|trieu|tr|m/g, "tr").replace(/nghìn|nghin|ngàn|ngan|k/g, "k");
  var m = s.match(/^(\d+(?:[.,]\d+)?)tr(\d{1,3})?$/);
  if (m) {
    var base = parseFloat(m[1].replace(",", ".")) * 1e6;
    var t = m[2] || "";
    while (t && t.length < 3) { t = t + "0" }
    return Math.round(base + (t ? parseInt(t, 10) * 1000 : 0));
  }
  m = s.match(/^(\d+(?:[.,]\d+)?)k$/);
  if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return parseInt(s.replace(/[.,]/g, ""), 10);
  if (/^\d+([.,]\d+)?$/.test(s)) return Math.round(parseFloat(s.replace(",", ".")));
  return null;
}
function fmt(n) { return new Intl.NumberFormat("vi-VN").format(Math.round(n || 0)) + " ₫" }

/* --- hiển thị tiền có dấu . ngăn hàng nghìn NGAY KHI GÕ --- */
function chiSo(s) { return String(s).replace(/\D/g, "") }
function nhomNghin(s) { return String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ".") }
function dinhDangTien(el) {
  var raw = String(el.value || "");
  if (/[^\d.,\s]/.test(raw)) return;   // đang gõ dạng 9tr / 500k -> để yên, chuẩn hoá khi rời ô
  var pos = (el.selectionStart == null) ? raw.length : el.selectionStart;
  var truoc = chiSo(raw.slice(0, pos)).length;
  var so = chiSo(raw);
  if (!so) { el.value = ""; return }
  var out = nhomNghin(so);
  el.value = out;
  var i = 0, d = 0;
  while (i < out.length && d < truoc) {
    if (/\d/.test(out.charAt(i))) d++;
    i++;
  }
  try { el.setSelectionRange(i, i) } catch (e) { }
}
function chuanHoaTien(el) {            // rời ô: 9tr -> 9.000.000 ; 1tr2 -> 1.200.000
  var v = parseMoney(el.value);
  if (v) el.value = nhomNghin(String(v));
}
function toast(t) {
  var el = $("#toast");
  el.textContent = t;
  el.classList.add("on");
  setTimeout(function () { el.classList.remove("on") }, 1900);
}
function haptic(kind) {
  if (!tg || !tg.HapticFeedback) return;
  if (kind) tg.HapticFeedback.notificationOccurred(kind);
  else tg.HapticFeedback.impactOccurred("light");
}
function ngayLamViec(thang) {
  var p = String(thang).split("-");
  var y = parseInt(p[0], 10), m = parseInt(p[1], 10);
  var tong = new Date(y, m, 0).getDate(), cn = 0;
  for (var d = 1; d <= tong; d++) { if (new Date(y, m - 1, d).getDay() === 0) cn++ }
  return { tong: tong, cn: cn, lv: tong - cn };
}

/* ---------- chip gợi ý ---------- */
$$("input[data-chips]").forEach(function (inp) {
  var box = document.createElement("div");
  box.className = "chips";
  inp.getAttribute("data-chips").split(",").forEach(function (v) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = v;
    b.addEventListener("click", function () {
      if (inp.hasAttribute("data-money")) {
        var so = parseMoney(v);
        inp.value = (so == null) ? v : nhomNghin(String(so));
      } else {
        inp.value = v;
      }
      haptic(); tinh();
    });
    box.appendChild(b);
  });
  inp.parentNode.appendChild(box);
});

/* ---------- đọc form ---------- */
function docForm() {
  var o = {};
  $$("[data-k]").forEach(function (el) {
    var k = el.getAttribute("data-k");
    var raw = String(el.value || "").trim();
    var v;
    if (raw === "") { v = 0 }
    else if (el.hasAttribute("data-money")) { v = parseMoney(raw) }
    else { v = /^\d+([.,]\d+)?$/.test(raw) ? parseFloat(raw.replace(",", ".")) : null }
    el.classList.toggle("bad", v === null);
    o[k] = (v === null) ? 0 : v;
  });
  o.extraCong = docExtraCong();
  return o;
}
function docExtraCong() {
  return $$(".extra-item").map(function (box) {
    var ten = box.querySelector(".extra-name").value.trim() || "Khoản cộng khác";
    var moneyEl = box.querySelector(".extra-money");
    var val = parseMoney(moneyEl.value);
    moneyEl.classList.toggle("bad", val === null);
    return { name: ten, value: val || 0 };
  }).filter(function (x) { return x.value > 0 });
}
function themKhoanCong(ten, tien) {
  var box = document.createElement("div");
  box.className = "extra-item";
  box.innerHTML = '<input class="extra-name" type="text" placeholder="Tên khoản, VD: Hoa hồng">' +
    '<input class="extra-money" type="text" inputmode="decimal" data-money placeholder="Số tiền">' +
    '<button type="button" class="extra-del" aria-label="Xoá khoản">×</button>';
  box.querySelector(".extra-name").value = ten || "";
  if (tien) box.querySelector(".extra-money").value = nhomNghin(String(tien));
  box.querySelector(".extra-del").addEventListener("click", function () { box.remove(); haptic(); tinh(); });
  $("#extraCong").appendChild(box);
}

/* ---------- tính lương ---------- */
function tinhLuong(inp, thang) {
  var w = ngayLamViec(thang);
  var lcb = inp.lcb || 0, nc = inp.nc || 0;
  var hs = inp.hs || 0, mcs = inp.mcs || lcb;
  var luongNgay = w.lv > 0 ? lcb / w.lv : 0;
  var luongNgayCong = Math.round(luongNgay * nc);
  var tienTN = Math.round(hs * mcs);
  var tienAn = Math.round((inp.ta || 0) * nc);
  var extraCong = inp.extraCong || [];
  var tongExtraCong = extraCong.reduce(function (sum, x) { return sum + (x.value || 0) }, 0);
  var cong = luongNgayCong + tienTN + tienAn +
    (inp.tc || 0) + (inp.ctp || 0) + (inp.th || 0) + (inp.ot || 0) + (inp.ups || 0) + tongExtraCong;
  var tru = (inp.dm || 0) + (inp.ph || 0) + (inp.ung || 0);
  return {
    thang: thang, tongNgay: w.tong, cn: w.cn, ngayLV: w.lv,
    lcb: lcb, nc: nc, hs: hs, mcs: mcs, ta: inp.ta || 0,
    luongNgay: Math.round(luongNgay), luongNgayCong: luongNgayCong,
    tienTN: tienTN, tienAn: tienAn,
    tc: inp.tc || 0, ctp: inp.ctp || 0, th: inp.th || 0, ot: inp.ot || 0, ups: inp.ups || 0,
    extraCong: extraCong, tongExtraCong: tongExtraCong,
    dm: inp.dm || 0, ph: inp.ph || 0, ung: inp.ung || 0,
    tongCong: cong, tongTru: tru, thucNhan: cong - tru
  };
}

/* ---------- số đếm động ---------- */
var lastVal = 0;
function animate(to) {
  var from = lastVal, t0 = performance.now(), dur = 420;
  lastVal = to;
  function step(t) {
    var k = Math.min(1, (t - t0) / dur);
    k = 1 - Math.pow(1 - k, 3);
    var v = Math.round(from + (to - from) * k);
    $("#tong").textContent = fmt(v);
    $("#barTong").textContent = fmt(v);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- render ---------- */
var cur = null;
function render(r) {
  animate(r.thucNhan);
  $("#tgNgay").textContent = r.ngayLV + " ngày làm việc · " + r.cn + " CN";
  $("#tgNgayLuong").textContent = fmt(r.luongNgay) + " / ngày";

  var t = Math.max(1, r.tongCong);
  $("#mP").style.width = Math.max(0, Math.min(100, (r.tongCong - r.tongTru) / t * 100)) + "%";
  $("#mM").style.width = Math.max(0, Math.min(100, r.tongTru / t * 100)) + "%";
  $("#sumFix").textContent = r.lcb ? fmt(r.lcb) : "chưa nhập";

  var html = "";
  function row(label, val, minus) {
    if (!val) return;
    html += '<div class="row ' + (minus ? "minus" : "plus") + '"><span>' + label +
      '</span><b>' + (minus ? "− " : "+ ") + fmt(val) + '</b></div>';
  }
  row("Lương ngày công (" + r.nc + " / " + r.ngayLV + " ngày)", r.luongNgayCong);
  row("Trách nhiệm (HS " + r.hs + " × " + fmt(r.mcs) + ")", r.tienTN);
  row("Tiền ăn (" + r.nc + " buổi × " + fmt(r.ta) + ")", r.tienAn);
  row("Trợ cấp", r.tc);
  row("Công tác phí", r.ctp);
  row("Thưởng nóng", r.th);
  row("Tăng ca", r.ot);
  row("Upsell", r.ups);
  (r.extraCong || []).forEach(function (x) { row(x.name, x.value); });
  row("Đi muộn", r.dm, true);
  row("Phạt", r.ph, true);
  row("Ứng lương", r.ung, true);
  html += '<div class="row sum"><span>THỰC NHẬN</span><b>' + fmt(r.thucNhan) + '</b></div>';
  $("#rows").innerHTML = html;

  var w = [];
  if (r.nc > r.ngayLV) w.push("Ngày công (" + r.nc + ") vượt số ngày làm việc (" + r.ngayLV + ")");
  if (r.hs > 2) w.push("Hệ số trách nhiệm " + r.hs + " khá cao, kiểm tra lại?");
  if (r.tongTru > r.tongCong * 0.5) w.push("Khoản trừ vượt 50% tổng thu nhập");
  if (!r.lcb) w.push("Chưa nhập lương cơ bản");
  $("#canhBao").innerHTML = w.map(function (x) { return '<div class="warn">⚠️ ' + x + '</div>' }).join("");

  var nCong = [r.tc, r.ctp, r.th, r.ot, r.ups].filter(Boolean).length + (r.extraCong || []).filter(function(x){return x.value}).length;
  var nTru = [r.dm, r.ph, r.ung].filter(Boolean).length;
  $("#nCong").textContent = nCong ? "(" + nCong + ")" : "";
  $("#nTru").textContent = nTru ? "(" + nTru + ")" : "";

  var ok = r.lcb > 0 && r.nc > 0;
  $("#btnGuiBot").disabled = !ok;
  $("#btnAnh").disabled = !ok;
  if (tg && tg.MainButton) {
    tg.MainButton.setText("💾 Lưu " + fmt(r.thucNhan));
    if (ok) tg.MainButton.enable();
    else tg.MainButton.disable();
    tg.MainButton.show();
  }
  cur = r;
}

/* ---------- chọn tháng bằng select (chạy được trên mọi WebView) ---------- */
function getThang() {
  var m = parseInt($("#mThang").value, 10) || (new Date().getMonth() + 1);
  var y = parseInt($("#mNam").value, 10) || new Date().getFullYear();
  return y + "-" + (m < 10 ? "0" + m : String(m));
}
function themNam(y) {
  if (!$("#mNam").querySelector('option[value="' + y + '"]')) {
    var op = document.createElement("option");
    op.value = String(y);
    op.textContent = "Năm " + y;
    $("#mNam").appendChild(op);
  }
}
function doiThang(buoc) {
  var m = (parseInt($("#mThang").value, 10) || 1) + buoc;
  var y = parseInt($("#mNam").value, 10) || new Date().getFullYear();
  if (m < 1) { m = 12; y = y - 1 }
  if (m > 12) { m = 1; y = y + 1 }
  themNam(y);
  $("#mThang").value = String(m);
  $("#mNam").value = String(y);
  haptic(); tinh();
}

function tinh() {
  var thang = getThang();
  $("#ncRange").max = ngayLamViec(thang).lv;
  render(tinhLuong(docForm(), thang));
}

/* ---------- sự kiện ---------- */
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.id === "ncRange") $("#ncNum").value = el.value;
  if (el.id === "ncNum") $("#ncRange").value = parseFloat(el.value) || 0;
  if (el.hasAttribute && el.hasAttribute("data-money")) dinhDangTien(el);
  tinh();
});
document.addEventListener("change", function (e) {
  if (e.target.id === "mThang" || e.target.id === "mNam") tinh();
});
document.addEventListener("blur", function (e) {
  if (e.target.hasAttribute && e.target.hasAttribute("data-money")) {
    chuanHoaTien(e.target);
    tinh();
  }
}, true);
$("#btnThemCong").addEventListener("click", function () {
  themKhoanCong();
  haptic();
  tinh();
  var items = $$(".extra-item");
  if (items.length) items[items.length - 1].querySelector(".extra-name").focus();
});
$("#mPrev").addEventListener("click", function () { doiThang(-1) });
$("#mNext").addEventListener("click", function () { doiThang(1) });
$("#ncUp").addEventListener("click", function () {
  $("#ncNum").value = (parseFloat($("#ncNum").value) || 0) + 1;
  $("#ncRange").value = $("#ncNum").value;
  haptic(); tinh();
});
$("#ncDown").addEventListener("click", function () {
  $("#ncNum").value = Math.max(0, (parseFloat($("#ncNum").value) || 0) - 1);
  $("#ncRange").value = $("#ncNum").value;
  haptic(); tinh();
});
$$(".tabs button").forEach(function (b) {
  b.addEventListener("click", function () {
    $$(".tabs button").forEach(function (x) { x.classList.remove("on") });
    $$(".panel").forEach(function (x) { x.classList.remove("on") });
    b.classList.add("on");
    var p = $("#p-" + b.getAttribute("data-tab"));
    p.classList.add("on");
    p.classList.add("flash");
    setTimeout(function () { p.classList.remove("flash") }, 400);
    haptic();
  });
});

/* ---------- gửi bot & xuất ảnh ---------- */
function payloadBot() {
  if (!cur) return null;
  return {
    month: parseInt($("#mThang").value, 10),
    year: parseInt($("#mNam").value, 10),
    lcb: cur.lcb || 0, nc: cur.nc || 0, hs: cur.hs || 0, mcs: cur.mcs || 0, ta: cur.ta || 0,
    tc: cur.tc || 0, ctp: cur.ctp || 0, th: cur.th || 0, ot: cur.ot || 0, ups: cur.ups || 0,
    extraCong: cur.extraCong || [],
    dm: cur.dm || 0, ph: cur.ph || 0, ung: cur.ung || 0,
    total: cur.thucNhan || 0
  };
}

function guiBot() {
  if (!cur || !cur.lcb || !cur.nc) { toast("Thiếu lương cơ bản hoặc ngày công"); return }
  var data = payloadBot();
  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify(data));
    haptic("success");
    toast("✅ Đã gửi về bot");
    setTimeout(function () { tg.close() }, 600);
  } else {
    haptic("error");
    toast("Chỉ gửi được khi mở trong Telegram");
  }
}

function drawText(ctx, text, x, y, size, weight, color, align) {
  ctx.font = (weight || 400) + " " + size + "px \"Be Vietnam Pro\", Arial, sans-serif";
  ctx.fillStyle = color || "#111827";
  ctx.textAlign = align || "left";
  ctx.fillText(text, x, y);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  var words = String(text).split(" "), line = "";
  for (var n = 0; n < words.length; n++) {
    var test = line + words[n] + " ";
    if (ctx.measureText(test).width > maxWidth && n > 0) { ctx.fillText(line.trim(), x, y); line = words[n] + " "; y += lineHeight; }
    else line = test;
  }
  ctx.fillText(line.trim(), x, y);
  return y;
}
function xuatAnh() {
  if (!cur || !cur.lcb || !cur.nc) { toast("Thiếu lương cơ bản hoặc ngày công"); return }
  var rows = [];
  function add(label, val, minus) { if (val) rows.push({ label: label, val: val, minus: !!minus }); }
  add("Lương ngày công (" + cur.nc + " / " + cur.ngayLV + " ngày)", cur.luongNgayCong);
  add("Trách nhiệm (HS " + cur.hs + ")", cur.tienTN);
  add("Tiền ăn", cur.tienAn);
  add("Trợ cấp", cur.tc); add("Công tác phí", cur.ctp); add("Thưởng nóng", cur.th); add("Tăng ca", cur.ot); add("Upsell", cur.ups);
  (cur.extraCong || []).forEach(function (x) { add(x.name, x.value); });
  add("Đi muộn", cur.dm, true); add("Phạt", cur.ph, true); add("Ứng lương", cur.ung, true);

  var c = document.createElement("canvas"), ctx = c.getContext("2d");
  c.width = 1080;
  c.height = Math.max(1040, 610 + rows.length * 72);

  // Background
  ctx.fillStyle = "#F5F7FB"; ctx.fillRect(0, 0, c.width, c.height);
  var bg = ctx.createRadialGradient(920, 80, 10, 920, 80, 430);
  bg.addColorStop(0, "rgba(34,211,238,.30)"); bg.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, 420);

  // Hero
  var g = ctx.createLinearGradient(60, 56, 1020, 336);
  g.addColorStop(0, "#4F46E5"); g.addColorStop(.52, "#1687E8"); g.addColorStop(1, "#20C7DA");
  ctx.fillStyle = g; roundRect(ctx, 60, 60, 960, 290, 38); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.beginPath(); ctx.arc(935, 40, 135, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.beginPath(); ctx.arc(1010, 245, 80, 0, Math.PI * 2); ctx.fill();

  drawText(ctx, "💰 Bảng lương", 100, 128, 30, 800, "#FFFFFF");
  drawText(ctx, "THÁNG " + cur.thang.slice(5) + "/" + cur.thang.slice(0,4), 100, 178, 20, 700, "rgba(255,255,255,.78)");
  drawText(ctx, fmt(cur.thucNhan), 100, 270, 62, 900, "#FFFFFF");

  // Stats pills under hero
  function pill(x, y, w, icon, a, b) {
    ctx.fillStyle = "#FFFFFF"; roundRect(ctx, x, y, w, 76, 24); ctx.fill();
    ctx.strokeStyle = "#E6EAF2"; ctx.lineWidth = 1; ctx.stroke();
    drawText(ctx, icon, x + 24, y + 48, 26, 700, "#2783DE");
    drawText(ctx, a, x + 64, y + 32, 18, 700, "#111827");
    drawText(ctx, b, x + 64, y + 56, 15, 500, "#6B7280");
  }
  pill(60, 380, 295, "🗓️", cur.ngayLV + " ngày làm việc", cur.cn + " ngày chủ nhật · " + cur.tongNgay + " ngày trong tháng");
  pill(392, 380, 300, "💵", fmt(cur.luongNgay), "lương / ngày");
  pill(728, 380, 292, "✅", cur.nc + " ngày công", "thực tế");

  // Detail card
  ctx.fillStyle = "#FFFFFF"; roundRect(ctx, 60, 490, 960, c.height - 590, 34); ctx.fill();
  ctx.strokeStyle = "#E6EAF2"; ctx.lineWidth = 1; ctx.stroke();
  drawText(ctx, "Chi tiết thu nhập", 100, 560, 28, 800, "#111827");
  drawText(ctx, "Các khoản có giá trị mới được hiển thị", 100, 592, 17, 500, "#8B95A7");

  var y = 660;
  rows.forEach(function (r) {
    ctx.fillStyle = r.minus ? "#FCE9E7" : "#E8F1EC";
    roundRect(ctx, 100, y - 36, 48, 48, 16); ctx.fill();
    drawText(ctx, r.minus ? "−" : "+", 124, y - 3, 28, 900, r.minus ? "#E56458" : "#46A171", "center");
    drawText(ctx, r.label, 170, y - 4, 23, 600, "#374151");
    drawText(ctx, (r.minus ? "− " : "+ ") + fmt(r.val), 980, y - 4, 24, 800, r.minus ? "#E56458" : "#16A34A", "right");
    ctx.strokeStyle = "#EEF1F6"; ctx.beginPath(); ctx.moveTo(170, y + 24); ctx.lineTo(980, y + 24); ctx.stroke();
    y += 72;
  });


  drawText(ctx, "Tạo từ Mini App tính lương", 60, c.height - 46, 20, 500, "#9AA4B2");
  var a = document.createElement("a");
  a.download = "bang-luong-" + cur.thang.slice(5) + "-" + cur.thang.slice(0,4) + ".png";
  a.href = c.toDataURL("image/png");
  a.click();
  haptic("success"); toast("✅ Đã xuất ảnh báo cáo");
}
$("#btnGuiBot").addEventListener("click", guiBot);
$("#btnAnh").addEventListener("click", xuatAnh);

/* ---------- khởi động ---------- */
(function init() {
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    if (tg.MainButton) tg.MainButton.onClick(guiBot);
  }
  var d = new Date();
  var yNay = d.getFullYear();
  var hM = "", hY = "";
  for (var i = 1; i <= 12; i++) { hM += '<option value="' + i + '">Tháng ' + i + '</option>' }
  for (var y = yNay - 3; y <= yNay + 3; y++) { hY += '<option value="' + y + '">Năm ' + y + '</option>' }
  $("#mThang").innerHTML = hM;
  $("#mNam").innerHTML = hY;
  $("#mThang").value = String(d.getMonth() + 1);
  $("#mNam").value = String(yNay);
  tinh();
})();
</script>
</body>
</html>
